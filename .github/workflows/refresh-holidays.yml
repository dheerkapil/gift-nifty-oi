name: refresh-holidays
on:
  schedule:
    - cron: "0 3 * * 1"     # Mondays 08:30 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh NSE IX holiday list
        run: python refresh_holidays.py
      - name: Commit if changed
        run: |
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "refresh holidays $(date -u +%F)"
          git push
