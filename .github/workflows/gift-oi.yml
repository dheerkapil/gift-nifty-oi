name: gift-oi-daily
on:
  schedule:
    - cron: "30 14 * * 1-5"     # 20:00 IST, Mon-Fri (14:30 UTC)
  workflow_dispatch:            # lets you run it by hand any time
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch latest GIFT Nifty OI
        run: python fetch_oi.py
      - name: Commit if changed
        run: |
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "GIFT OI $(date -u +%F)"
          git push
