name: gift-oi-daily
on:
  schedule:
    # The OI file lands ~21:30-22:05 IST and the Nifty price file ~02:55 IST the
    # next morning, so a day can only be charted after ~03:00 IST. One run at
    # 05:00 IST, then four half-hourly retries in case the files are late.
    # Every run only sends when data changed, so retries cannot duplicate.
    # IST = UTC+5:30, so these fall on the previous UTC day.
    # Tue-Sat IST, because a trading day's data is only complete the next
    # morning (Friday's price file lands ~02:55 Saturday).
    - cron: "30 23 * * 1-5"        # 05:00 IST, Tue-Sat
    - cron: "0,30 0-1 * * 2-6"     # 05:30, 06:00, 06:30, 07:00 IST, Tue-Sat
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gift-nifty-oi
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install chart deps
        run: pip install --quiet pandas matplotlib
      - name: Fetch latest GIFT Nifty OI
        run: python fetch_oi.py
      - name: Did the data change?
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve Telegram chat id
        id: chat
        if: steps.diff.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CID" ]; then CID=$(python3 resolve_chat.py); fi
          echo "id=$CID" >> "$GITHUB_OUTPUT"
      - name: Build chart and send to Telegram
        if: steps.chat.outputs.id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python plot_chart.py
          if ! curl -sS --fail-with-body -X POST \
               -F chat_id=${{ steps.chat.outputs.id }} \
               -F caption="GIFT Nifty OI - $(date -u +%F)" \
               -F photo=@chart.png \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" > /tmp/tg.json; then
            echo "Telegram HTTP error; response body:"; head -c 400 /tmp/tg.json; echo; exit 1
          fi
          head -c 400 /tmp/tg.json; echo
          python3 -c 'import json; d=json.load(open("/tmp/tg.json")); raise SystemExit(0 if d.get("ok") is True else 1)'
      - name: Commit if changed
        run: |
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "GIFT OI $(date -u +%F)"
          git push
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CID" ]; then CID=$(python3 resolve_chat.py || true); fi
          if [ -z "$CID" ]; then echo "no chat id for failure notice"; exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$CID" \
            --data-urlencode text="GIFT OI job FAILED $(date -u '+%F %H:%M UTC') - no chart was sent. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || true
