name: gift-oi-daily
on:
  schedule:
    - cron: "30 11-17 * * 1-5"     # 17:00-23:00 IST, hourly, Mon-Fri
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install chart deps
        run: pip install --quiet pandas matplotlib
      - name: Fetch latest GIFT Nifty OI
        run: python fetch_oi.py
      - name: Did the data change?
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build chart + send to Telegram
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python plot_chart.py
          if [ -z "${TG_TOKEN:-}" ]; then echo "no TELEGRAM_BOT_TOKEN secret - skipping"; exit 0; fi
          CHAT="${TG_CHAT:-}"
          if [ -z "$CHAT" ]; then
            echo "TELEGRAM_CHAT_ID not set - resolving from getUpdates..."
            CHAT=$(curl -s "https://api.telegram.org/bot$TG_TOKEN/getUpdates" | python3 -c "
import sys,json
d=json.load(sys.stdin)
for u in reversed(d.get('result',[])):
    m=u.get('message') or u.get('channel_post') or {}
    c=m.get('chat',{})
    if c.get('id'): print(c['id']); break
")
          fi
          if [ -z "$CHAT" ]; then
            echo "no chat found - send your bot a message once, then re-run"; exit 0
          fi
          echo "sending to chat $CHAT"
          curl -s -F chat_id="$CHAT" \
               -F caption="GIFT Nifty OI - $(date -u +%F)" \
               -F photo=@chart.png \
               "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" | head -c 400
          echo
      - name: Commit if changed
        run: |
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "GIFT OI $(date -u +%F)"
          git push
