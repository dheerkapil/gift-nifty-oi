name: gift-oi-daily
on:
  schedule:
    - cron: "30 11-17 * * 1-5"     # 17:00-23:00 IST, hourly, Mon-Fri
  workflow_dispatch:
    inputs:
      force:
        description: "send the chart even if no new data"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install chart deps
        run: pip install --quiet pandas matplotlib
      - name: Fetch latest GIFT Nifty OI
        run: python fetch_oi.py
      - name: Did the data change?
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve Telegram chat id
        id: chat
        if: steps.diff.outputs.changed == 'true' || inputs.force == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CID" ]; then CID=$(python3 resolve_chat.py); fi
          echo "id=$CID" >> "$GITHUB_OUTPUT"
      - name: Build chart and send to Telegram
        if: steps.chat.outputs.id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python plot_chart.py
          curl -s -F chat_id=${{ steps.chat.outputs.id }} \
               -F caption="GIFT Nifty OI - $(date -u +%F)" \
               -F photo=@chart.png \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto" | head -c 400
          echo
      - name: Commit if changed
        run: |
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "GIFT OI $(date -u +%F)"
          git push
