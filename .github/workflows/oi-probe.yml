name: oi-probe
# Diagnostic only - NOT scheduled. Checks whether the day's NSE IX GIFT Nifty
# report files exist and reads the server's Last-Modified (publication) time.
# Header-only requests: the reports are never downloaded.
#
# Manual use:
#   lookback=16, backfill=true   -> rewrite data/upload_times.csv for the last
#                                   16 weekdays with publication times
#   backfill=false               -> append newly seen files to data/probe_log.csv
on:
  workflow_dispatch:
    inputs:
      lookback:
        description: "How many weekdays to inspect (1-30)"
        required: false
        default: "16"
      backfill:
        description: "true = write data/upload_times.csv for all days"
        required: false
        default: "true"
permissions:
  contents: write
concurrency:
  group: gift-oi-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe report availability (headers only)
        env:
          LOOKBACK: ${{ inputs.lookback }}
          BACKFILL: ${{ inputs.backfill }}
        run: python probe_oi.py
      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          for f in data/upload_times.csv data/probe_log.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "probe: publication times for last $(echo "${LOOKBACK:-16}") weekdays"
            git push
          fi
