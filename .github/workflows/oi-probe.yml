name: oi-probe
# Temporary diagnostic: hourly check of whether the day's NSE IX GIFT Nifty
# report files exist yet, recording the first time each one is seen in
# data/probe_log.csv.  Header-only requests; the reports are never downloaded.
# Self-expiring - probe_oi.py no-ops after 2026-11-03 IST.  Safe to delete.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gift-oi-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe report availability (headers only)
        run: python probe_oi.py
      - name: Commit first-seen log
        run: |
          set -euo pipefail
          git config user.name  gift-oi-bot
          git config user.email gift-oi-bot@users.noreply.github.com
          if [ -f data/probe_log.csv ]; then
            git add data/probe_log.csv
            if git diff --staged --quiet; then
              echo "no new first-seen rows"
            else
              git commit -m "probe: first-seen report times"
              git push
            fi
          else
            echo "no probe log yet"
          fi
